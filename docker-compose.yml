services:
  mariadb:
    image: mariadb:10.11
    container_name: cmms_mariadb
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=cmms@Admin123
      - MARIADB_DATABASE=CMMS
      - MARIADB_USER=cmms_user
      - MARIADB_PASSWORD=cmms@Admin123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p'cmms@Admin123' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: cmms_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_TYPE=mysql
      - DB_SERVER=mariadb
      - DB_NAME=CMMS
      - DB_USER=root
      - DB_PASSWORD=cmms@Admin123
      - WEB_CONCURRENCY=4
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - .:/app
      - uploads_data:/app/static/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mariadb_data:
  uploads_data:
