{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}

{% block content %}
<div class="container mt-4">
  <h3>🔑 Đổi mật khẩu cho {{ emp.FullName }}</h3>
  <form method="POST">
    <div class="mb-3">
      <label>Mật khẩu mới</label>
      <input type="password" name="Password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">💾 Lưu mật khẩu mới</button>
    <a href="{{ url_for('account.list_accounts') }}" class="btn btn-secondary">↩️ Quay lại</a>
  </form>
</div>
{% endblock %}
