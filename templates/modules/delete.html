{% extends "base.html" %}
{% block content %}
<h3>📋 Danh sách module</h3>

<a href="{{ url_for('module.add_module') }}" class="btn btn-primary mb-3">➕ Thêm module</a>

<table class="table table-bordered table-hover">
  <thead class="table-light">
    <tr>
      <th>#</th>
      <th>Mã module</th>
      <th>Tên module</th>
      <th>Mô tả</th>
      <th class="text-center">Thao tác</th>
    </tr>
  </thead>
  <tbody>
    {% for m in modules %}
    <tr>
      <td>{{ loop.index }}</td>
      <td>{{ m.ModuleCode }}</td>
      <td>{{ m.ModuleName }}</td>
      <td>{{ m.Description }}</td>
      <td class="text-center">
        <form method="post" action="{{ url_for('module.delete_module', module_id=m.ModuleID) }}"
              style="display:inline;" onsubmit="return confirm('Bạn có chắc muốn xoá module này?')">
          <button type="submit" class="btn btn-sm btn-danger">🗑️</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
