{% extends "layout_sidebar.html" %}
{% block title %}{{ 'Thêm' if not module else 'Cập nhật' }} Module{% endblock %}
{% block content %}
<h3>{{ '➕ Thêm' if not module else '✏️ Sửa' }} Module</h3>
<form method="post">
  <div class="mb-3"><label>Module Code</label><input name="ModuleCode" class="form-control" value="{{ module.ModuleCode if module else '' }}" required></div>
  <div class="mb-3"><label>Module Name</label><input name="ModuleName" class="form-control" value="{{ module.ModuleName if module else '' }}" required></div>
  <div class="mb-3"><label>Mô tả</label><textarea name="Description" class="form-control">{{ module.Description if module else '' }}</textarea></div>
  <button type="submit" class="btn btn-success">💾 Lưu</button>
</form>
{% endblock %}
