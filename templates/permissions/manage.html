{% extends "base.html" %}
{% block title %}Phân quyền cho vai trò{% endblock %}

{% block content %}
<div class="container mt-4">
  <h3>🔐 Gán quyền cho vai trò</h3>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Chọn vai trò</label>
      <select name="role" class="form-select" required onchange="this.form.submit()">
        <option value="">-- Chọn vai trò --</option>
        {% for role in roles %}
          <option value="{{ role.RoleID }}" {% if request.form.get('role', '')|int == role.RoleID %}selected{% endif %}>
            {{ role.RoleName }}
          </option>
        {% endfor %}
      </select>
    </div>

    {% if request.method == 'POST' and request.form.get('role') %}
    <div class="card p-3 border">
      <h5>✅ Danh sách quyền:</h5>
      <div class="row row-cols-1 row-cols-md-2 g-2">
        {% for perm in permissions %}
       <div class="form-check">
  <input class="form-check-input" type="checkbox" name="permissions" value="{{ perm.PermissionID }}"
         id="perm{{ perm.PermissionID }}"
         {% if perm.PermissionID in selected_permissions %}checked{% endif %}>
  <label class="form-check-label" for="perm{{ perm.PermissionID }}">
    <strong>{{ perm.module.ModuleCode if perm.module else '?' }}:{{ perm.Action }}</strong> — {{ perm.Description }}
  </label>
</div>

        {% endfor %}
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary">💾 Cập nhật quyền</button>
      </div>
    </div>
    {% endif %}
  </form>
</div>
{% endblock %}
