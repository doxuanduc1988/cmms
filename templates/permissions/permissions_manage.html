{% extends "base.html" %}
{% block content %}
<h3>🔐 Gán quyền cho vai trò: {{ role.RoleName }}</h3>

<form method="post">
  <table class="table table-bordered table-hover">
    <thead class="table-light">
      <tr>
        <th>Module</th>
        <th class="text-center">Read</th>
        <th class="text-center">Create</th>
        <th class="text-center">Update</th>
        <th class="text-center">Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for module in modules %}
      <tr>
        <td>{{ module }}</td>
        {% for action in actions %}
        <td class="text-center">
          <input type="checkbox" name="permissions" value="{{ module }}:{{ action }}"
                 {% if (module, action) in current_keys %}checked{% endif %}>
        </td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <div class="mt-3">
    <button type="submit" class="btn btn-primary">💾 Lưu quyền</button>
    <a href="{{ url_for('role.list_roles') }}" class="btn btn-secondary">↩️ Quay lại</a>
  </div>
</form>
{% endblock %}
