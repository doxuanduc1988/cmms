{% extends "base.html" %}
{% block content %}
<h3>➕ Thêm quyền cho module mới</h3>

<form method="post">
  <div class="mb-3">
    <label>Mã module</label>
    <input type="text" name="ModuleCode" class="form-control" required>
  </div>

  <div class="mb-3">
    <label>Chọn quyền mặc định</label><br>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" name="actions" value="read" checked>
      <label class="form-check-label">Read</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" name="actions" value="create" checked>
      <label class="form-check-label">Create</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" name="actions" value="update" checked>
      <label class="form-check-label">Update</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" name="actions" value="delete" checked>
      <label class="form-check-label">Delete</label>
    </div>
  </div>

  <button type="submit" class="btn btn-primary">💾 Tạo quyền</button>
  <a href="{{ url_for('permission_manage.permission_list') }}" class="btn btn-secondary">↩️ Danh sách</a>
</form>
{% endblock %}
