{% extends "base.html" %}

{% block title %}Thêm phòng ban{% endblock %}
{% block breadcrumb %}Nhân sự / Phòng ban / Thêm mới{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h3 class="fw-bold mb-0"><i class="fas fa-plus-circle me-2 text-primary"></i>Thêm phòng ban mới</h3>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form action="{{ url_for('department.create_department') }}" method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="DepartmentCode" class="form-label fw-semibold">Mã phòng ban</label>
                    <input type="text" id="DepartmentCode" name="DepartmentCode" class="form-control shadow-sm" placeholder="VD: PCHC, PXSC..." required>
                </div>
                <div class="col-md-6">
                    <label for="DepartmentName" class="form-label fw-semibold">Tên phòng ban</label>
                    <input type="text" id="DepartmentName" name="DepartmentName" class="form-control shadow-sm" placeholder="Nhập tên phòng ban/phân xưởng" required>
                </div>
                <div class="col-12">
                    <label for="Description" class="form-label fw-semibold">Mô tả</label>
                    <textarea id="Description" name="Description" class="form-control shadow-sm" rows="3" placeholder="Thông tin thêm về phòng ban"></textarea>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                    <i class="fas fa-save me-1"></i> Lưu thông tin
                </button>
                <a href="{{ url_for('department.list_departments') }}" class="btn btn-light px-4 border shadow-sm">
                    <i class="fas fa-times me-1"></i> Hủy
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
