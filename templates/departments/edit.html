{% extends "base.html" %}

{% block title %}Sửa phòng ban{% endblock %}
{% block breadcrumb %}Nhân sự / Phòng ban / Chỉnh sửa{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h3 class="fw-bold mb-0"><i class="fas fa-edit me-2 text-warning"></i>Sửa thông tin phòng ban</h3>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <div class="alert alert-info border-0 shadow-sm mb-4">
            <i class="fas fa-info-circle me-2"></i> Đang chỉnh sửa phòng ban: <strong>{{ department.DepartmentCode }}</strong>
        </div>

        <form action="{{ url_for('department.edit_department', DepartmentCode=department.DepartmentCode) }}" method="post">
            <div class="row g-3">
                <div class="col-md-12">
                    <label for="DepartmentName" class="form-label fw-semibold">Tên phòng ban</label>
                    <input type="text" id="DepartmentName" name="DepartmentName" class="form-control shadow-sm"
                           value="{{ department.DepartmentName }}" required>
                </div>
                <div class="col-12">
                    <label for="Description" class="form-label fw-semibold">Mô tả</label>
                    <textarea id="Description" name="Description" class="form-control shadow-sm" rows="3">{{ department.Description }}</textarea>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                    <i class="fas fa-save me-1"></i> Cập nhật
                </button>
                <a href="{{ url_for('department.list_departments') }}" class="btn btn-light px-4 border shadow-sm">
                    <i class="fas fa-times me-1"></i> Hủy
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
