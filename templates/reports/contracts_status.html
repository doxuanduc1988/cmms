{% extends "base.html" %}
{% block content %}
<h4>📄 Báo cáo tình trạng hợp đồng</h4>

<div class="mb-3">
  <a href="{{ url_for('report.export_contracts_status_excel') }}" class="btn btn-success">📥 Xuất Excel</a>
  <a href="{{ url_for('report.print_contracts_status') }}" class="btn btn-secondary" target="_blank">🖨️ In / PDF</a>
</div>

<table class="table table-bordered table-hover">
  <thead class="table-light">
    <tr>
      <th>#</th>
      <th>Trạng thái hợp đồng</th>
      <th>Số lượng hợp đồng</th>
    </tr>
  </thead>
  <tbody>
    {% for row in stats %}
    <tr>
      <td>{{ loop.index }}</td>
      <td>{{ row.Status or 'Không xác định' }}</td>
      <td>{{ row.Total }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
