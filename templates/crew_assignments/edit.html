<!-- templates/crew_assignments/edit.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa phân công nhân sự</title>
</head>
<body>
    <h2>Chỉnh sửa phân công nhân sự vào Kíp</h2>

    <form method="POST" action="{{ url_for('crew_assignments.edit_crew_assignment', assignment_id=assignment.AssignmentID) }}">
        <div style="margin-bottom: 10px;">
            <label>Nhân viên:</label><br>
            <select name="employee_id" required style="width: 300px; padding: 5px;">
                {% for emp in employees %}
                    <option value="{{ emp.EmployeeID }}"
                        {% if assignment.EmployeeID == emp.EmployeeID %} selected {% endif %}
                    >{{ emp.EmployeeID }} - {{ emp.FullName }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 10px;">
            <label>Phòng/Phân xưởng:</label><br>
            <select name="department_code" required style="width: 300px; padding: 5px;">
                {% for dept in departments %}
                    <option value="{{ dept.DepartmentCode }}"
                        {% if assignment.DepartmentCode == dept.DepartmentCode %} selected {% endif %}
                    >{{ dept.DepartmentName }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 10px;">
            <label>Kíp làm việc:</label><br>
            <select name="crew_id" required style="width: 300px; padding: 5px;">
                {% for crew in crews %}
                    <option value="{{ crew.CrewID }}"
                        {% if assignment.CrewID == crew.CrewID %} selected {% endif %}
                    >{{ crew.CrewName }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 10px;">
            <label>Chức danh:</label><br>
            <select name="job_position_id" style="width: 300px; padding: 5px;">
                <option value="">-- Không chọn --</option>
                {% for position in positions %}
                    <option value="{{ position.JobPositionID }}"
                        {% if assignment.JobPositionID == position.JobPositionID %} selected {% endif %}
                    >{{ position.JobPositionName }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 10px;">
            <label>Ngày bắt đầu:</label><br>
            <input type="date" name="start_date" required value="{{ assignment.StartDate.strftime('%Y-%m-%d') if assignment.StartDate else '' }}" style="padding: 5px;">
        </div>

        <div style="margin-bottom: 10px;">
            <label>Ngày kết thúc:</label><br>
            <input type="date" name="end_date" value="{{ assignment.EndDate.strftime('%Y-%m-%d') if assignment.EndDate else '' }}" style="padding: 5px;">
            <br><small>(Có thể để trống nếu chưa xác định ngày kết thúc)</small>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" style="padding: 8px 16px; background-color: #2196F3; color: white; border: none; border-radius: 4px;">💾 Cập nhật</button>

            <a href="{{ url_for('crew_assignments.list_crew_assignments') }}" style="margin-left: 10px; padding: 8px 16px; background-color: #9e9e9e; color: white; text-decoration: none; border-radius: 4px;">🔙 Quay lại danh sách</a>
        </div>
    </form>
</body>
</html>
