{% extends "base.html" %}
{% block content %}
<h4>{{ '➕ Gán mới' if action == 'create' else '✏️ Cập nhật' }} nhân sự vào Kíp</h4>

<form method="post">
  <div class="mb-3">
    <label>Nhân sự</label>
    <select name="EmployeeID" class="form-control" onchange="fillDepartment(this)" required>
    {% for emp in employees %}
      <option 
        value="{{ emp.EmployeeID }}"
        data-department="{{ emp.DepartmentCode }}"
        data-position="{{ emp.JobPosition }}">
        {{ emp.FullName }} ({{ emp.EmployeeID }})
      </option>
    {% endfor %}
  </select>
  </div>

  <div class="mb-3">
    <label>Phòng/Phân xưởng</label>
    <input type="text" name="DepartmentCode" id="DepartmentCode" class="form-control" readonly>
  </div>

  <div class="mb-3">
    <label>Kíp</label>
    <select name="CrewID" class="form-control" required>
      {% for crew in crews %}
        <option value="{{ crew.CrewID }}" {% if assignment and assignment.CrewID == crew.CrewID %}selected{% endif %}>
          {{ crew.CrewName }}
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label>Vị trí công việc</label>
    <input type="text" name="Position" id="Position" class="form-control" value="{{ assignment.Position if assignment else '' }}">
  </div>

  <button type="submit" class="btn btn-primary">💾 Lưu</button>
  <a href="{{ url_for('crew_assignment.crew_assignment_list') }}" class="btn btn-secondary">↩️ Quay lại</a>
</form>

<script>
function fillDepartment(selectElement) {
  const department = selectElement.options[selectElement.selectedIndex].getAttribute('data-department');
  document.getElementById('DepartmentCode').value = department || '';
}
</script>
{% endblock %}
