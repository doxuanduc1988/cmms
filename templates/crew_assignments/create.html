<!-- templates/crew_assignments/create.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm mới phân công nhân sự</title>
</head>
<body>
    <h2>Thêm mới phân công nhân sự vào Kíp</h2>

    <form method="POST" action="{{ url_for('crew_assignments.create_crew_assignment') }}">
        <div style="margin-bottom: 10px;">
            <label>Nhân viên:</label><br>
            <select name="employee_id" required style="width: 300px; padding: 5px;">
                <option value="">-- Chọn nhân viên --</option>
                {% for emp in employees %}
                    <option value="{{ emp.EmployeeID }}">{{ emp.EmployeeID }} - {{ emp.FullName }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 10px;">
            <label>Phòng/Phân xưởng:</label><br>
            <select name="department_code" required style="width: 300px; padding: 5px;">
                <option value="">-- Chọn phòng/phân xưởng --</option>
                {% for dept in departments %}
                    <option value="{{ dept.DepartmentCode }}">{{ dept.DepartmentName }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 10px;">
            <label>Kíp làm việc:</label><br>
            <select name="crew_id" required style="width: 300px; padding: 5px;">
                <option value="">-- Chọn kíp --</option>
                {% for crew in crews %}
                    <option value="{{ crew.CrewID }}">{{ crew.CrewName }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 10px;">
            <label>Chức danh:</label><br>
            <select name="job_position_id" style="width: 300px; padding: 5px;">
                <option value="">-- Chọn chức danh (nếu có) --</option>
                {% for position in positions %}
                    <option value="{{ position.JobPositionID }}">{{ position.JobPositionName }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 10px;">
            <label>Ngày bắt đầu:</label><br>
            <input type="date" name="start_date" required value="{{today}}" style="padding: 5px;">
        </div>

        <div style="margin-bottom: 10px;">
            <label>Ngày kết thúc:</label><br>
            <input type="date" name="end_date" style="padding: 5px;">
            <br><small>(Có thể bỏ trống nếu chưa xác định ngày kết thúc)</small>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" style="padding: 8px 16px; background-color: #4CAF50; color: white; border: none; border-radius: 4px;">💾 Lưu phân công</button>

            <a href="{{ url_for('crew_assignments.list_crew_assignments') }}" style="margin-left: 10px; padding: 8px 16px; background-color: #9e9e9e; color: white; text-decoration: none; border-radius: 4px;">🔙 Quay lại danh sách</a>
        </div>
    </form>
</body>
</html>
