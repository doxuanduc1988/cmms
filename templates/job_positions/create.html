{% extends "base.html" %}

{% block title %}Thêm mới Chức danh Công việc{% endblock %}
{% block breadcrumb %}Nhân sự / Chức danh / Thêm mới{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h3 class="fw-bold mb-0"><i class="fas fa-plus-circle me-2 text-primary"></i>Thêm chức danh mới</h3>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('job_positions.create_job_position') }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Mã chức danh</label>
                    <input type="text" name="job_position_code" class="form-control shadow-sm" placeholder="VD: CD001, KSTK..." required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Tên chức danh</label>
                    <input type="text" name="job_position_name" class="form-control shadow-sm" placeholder="Nhập tên chức danh công việc" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Mô tả</label>
                    <textarea name="description" rows="4" class="form-control shadow-sm" placeholder="Mô tả chi tiết về chức danh"></textarea>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                    <i class="fas fa-save me-1"></i> Lưu chức danh
                </button>
                <a href="{{ url_for('job_positions.list_job_positions') }}" class="btn btn-light px-4 border shadow-sm">
                    <i class="fas fa-times me-1"></i> Hủy
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
