{% extends "base.html" %}

{% block title %}Hồ sơ Nhân sự{% endblock %}
{% block breadcrumb %}Nhân sự{% endblock %}

{% block content %}
<div class="mb-4">
    <h2 class="fw-bold">Quản lý Nhân sự</h2>
    <p class="text-muted">Quản lý hồ sơ, phòng ban, chức danh và sức khỏe nhân viên.</p>
</div>

<div class="row g-3">
    <div class="col-6 col-md-4 col-lg-2">
        <a href="/hr" class="action-card">
            <i class="fas fa-id-card-alt action-icon text-success"></i>
            <h6 class="action-title">Hồ sơ nhân sự</h6>
        </a>
    </div>
    <div class="col-6 col-md-4 col-lg-2">
        <a href="/departments" class="action-card">
            <i class="fas fa-building action-icon text-success"></i>
            <h6 class="action-title">Phòng ban</h6>
        </a>
    </div>
    <div class="col-6 col-md-4 col-lg-2">
        <a href="/salary-table" class="action-card">
            <i class="fas fa-coins action-icon text-success"></i>
            <h6 class="action-title">Bậc lương</h6>
        </a>
    </div>
    <div class="col-6 col-md-4 col-lg-2">
        <a href="/job_positions" class="action-card">
            <i class="fas fa-briefcase action-icon text-success"></i>
            <h6 class="action-title">Chức danh</h6>
        </a>
    </div>
    <div class="col-6 col-md-4 col-lg-2">
        <a href="{{ url_for('health_index.search_health') }}" class="action-card">
            <i class="fas fa-notes-medical action-icon text-success"></i>
            <h6 class="action-title">Tra cứu sức khỏe</h6>
        </a>
    </div>
    <div class="col-6 col-md-4 col-lg-2">
        <a href="{{ url_for('hr_report.employees_by_department') }}" class="action-card">
            <i class="fas fa-chart-bar action-icon text-success"></i>
            <h6 class="action-title">Thống kê</h6>
        </a>
    </div>
</div>
{% endblock %}
