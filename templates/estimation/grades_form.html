{% extends "estimation/dashboard.html" %}
{% block est_content %}
<h2 class="page-title">{{ "Sửa bậc tay nghề" if grade else "Thêm bậc tay nghề mới" }}</h2>
<p class="page-subtitle">Nhập thông tin bậc thợ theo thang 7 bậc ngành điện lực Việt Nam.</p>

<div class="form-card" style="max-width: 600px;">
    <form method="POST">
        <div class="form-group">
            <label>Mã bậc (VD: 3.5/7, 4/7)</label>
            <input type="text" name="GradeCode" class="form-control" required value="{{ grade.GradeCode if grade else '' }}" placeholder="VD: 3.5/7">
        </div>
        <div class="form-group">
            <label>Tên bậc</label>
            <input type="text" name="GradeName" class="form-control" required value="{{ grade.GradeName if grade else '' }}" placeholder="VD: Thợ bậc 3.5/7">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label>Hệ số lương</label>
                <input type="number" step="0.01" name="Coefficient" class="form-control" required value="{{ grade.Coefficient if grade else '' }}" placeholder="VD: 2.31">
            </div>
            <div class="form-group">
                <label>Lương ngày (VNĐ)</label>
                <input type="number" step="1000" name="DailyWage" class="form-control" required value="{{ grade.DailyWage|int if grade else '' }}" placeholder="VD: 350000">
            </div>
        </div>
        <div class="form-group">
            <label>Mô tả</label>
            <textarea name="Description" class="form-control" rows="2">{{ grade.Description if grade else '' }}</textarea>
        </div>
        <div style="display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Lưu</button>
            <a href="{{ url_for('estimation.list_grades') }}" class="btn btn-outline">Huỷ</a>
        </div>
    </form>
</div>
{% endblock %}
