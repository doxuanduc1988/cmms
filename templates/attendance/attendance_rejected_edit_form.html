<!-- Partial template: Rejected Edit Form -->
<div class="form-card" style="max-width:100%; margin-top: 24px;">
  <h5 class="fw-bold mb-4"><i class="fas fa-pen-to-square text-primary me-2"></i>Sửa bản ghi bị từ chối</h5>
  <form method="post" class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Mã nhân viên</label>
      <input type="text" class="form-control" name="EmployeeID" value="{{ record.EmployeeID }}" readonly style="background:#f8fafc;">
    </div>
    <div class="col-md-4">
      <label class="form-label">Ngày</label>
      <input type="date" class="form-control" name="Date" value="{{ record.Date }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Ghi chú</label>
      <input type="text" class="form-control" name="Note" value="{{ record.Note }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Giờ vào</label>
      <input type="time" class="form-control" name="CheckInTime" value="{{ record.CheckInTime }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Giờ ra</label>
      <input type="time" class="form-control" name="CheckOutTime" value="{{ record.CheckOutTime }}">
    </div>
    <div class="col-12 d-flex gap-2 justify-content-end">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-save me-1"></i> Lưu & Gửi lại duyệt
      </button>
      <a href="{{ url_for('attendance_rejected.list_rejected_attendance') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-left me-1"></i> Quay lại
      </a>
    </div>
  </form>
</div>
